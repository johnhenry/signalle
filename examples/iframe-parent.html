<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parent Window - Cross Context Signals Demo</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        padding: 20px;
      }
      iframe {
        border: 2px solid #ccc;
        border-radius: 4px;
        margin: 20px 0;
      }
      button {
        padding: 8px 16px;
        margin: 5px;
      }
      .container {
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Parent Window Signal Value: <span id="parentValue">0</span></h2>
      <button id="increment">Increment from Parent</button>
      <button id="updateObject">Update Object Value</button>
    </div>

    <iframe
      src="iframe-child.html"
      width="600"
      height="200"
      title="Child frame for signal demonstration"
    >
    </iframe>

    <script type="module">
      class Signal {
        #value;
        #version = 0;
        #effects = new Set();
        #channel;

        constructor(initialValue, channelName = "default-signal") {
          this.#value = initialValue;
          this.#channel = new BroadcastChannel(channelName);

          this.#channel.onmessage = (event) => {
            const { value, version } = event.data;
            if (version > this.#version) {
              this.#version = version;
              this.#value = value;
              this.#notifyEffects();
            }
          };
        }

        get value() {
          return this.#value;
        }

        set value(newValue) {
          const clonedValue = structuredClone(newValue);

          if (Object.is(this.#value, clonedValue)) return;

          this.#value = clonedValue;
          this.#version++;

          this.#channel.postMessage({
            value: this.#value,
            version: this.#version,
          });

          this.#notifyEffects();
        }

        subscribe(fn) {
          this.#effects.add(fn);
          fn(this.#value);
          return () => this.#effects.delete(fn);
        }

        #notifyEffects() {
          for (const effect of this.#effects) {
            effect(this.#value);
          }
        }

        dispose() {
          this.#channel.close();
          this.#effects.clear();
        }
      }

      // Create two signals - one for primitive value, one for object
      const counterSignal = new Signal(0, "iframe-counter");
      const objectSignal = new Signal(
        {
          message: "Hello from parent",
          timestamp: new Date().toISOString(),
        },
        "iframe-object"
      );

      // Set up UI updates
      const parentValueEl = document.getElementById("parentValue");
      const incrementBtn = document.getElementById("increment");
      const updateObjectBtn = document.getElementById("updateObject");

      // Subscribe to counter signal updates
      counterSignal.subscribe((value) => {
        parentValueEl.textContent = value;
      });

      // Handle increment button clicks
      incrementBtn.addEventListener("click", () => {
        counterSignal.value = counterSignal.value + 1;
      });

      // Handle object updates
      updateObjectBtn.addEventListener("click", () => {
        objectSignal.value = {
          message: `Hello from parent at ${new Date().toLocaleTimeString()}`,
          timestamp: new Date().toISOString(),
        };
      });
    </script>
  </body>
</html>
